{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Visualización - Yoltic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" href="{% static 'utils/Logo.ico'%}" type="image/x-icon">
  <link rel="stylesheet" href="{% static 'styles/visualizacion.css' %}">
</head>
<body>

<!-- Header con branding y estado -->
<header class="header-tactical">
  <div class="header-content">
    <div class="brand-section">
      <img src="{% static 'utils/Logo.ico'%}" alt="Logo Yoltic" class="logo-brand">
      <h1 class="system-title">Sistema de Vigilancia</h1>
    </div>
    
    <div class="status-section">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Conectado</span>
      </div>
      <div class="datetime-display" id="datetime"></div>
    </div>
  </div>
</header>

<!-- Contenedor principal -->
<main class="main-container">
  <!-- Panel de control superior -->
  <section id="control-panel" class="control-panel">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex gap-2">
        {% csrf_token %} 
        <button id="btn-iniciar" class="btn btn-tactical">
          <i class="bi bi-record-circle"></i> Iniciar Grabación
        </button>
        <button id="btn-detener" class="btn btn-tactical" disabled>
          <i class="bi bi-stop-circle"></i> Detener Grabación
        </button>
      </div>

      <div id="parte-derecha" class="d-flex gap-2">
        <div class="recording-indicator" id="recording-indicator">
          <span class="recording-dot"></span>
          <span id="recording-text">No grabando</span>
        </div>
        <a id="btn-grabaciones" href="{% url 'lista_grabaciones' %}" class="btn btn-tactical-secondary">
          <i class="bi bi-collection-play"></i> Ver Grabaciones
        </a>
      </div>
    </div>
  </section>

  <!-- Contenedor de cámaras con diseño central destacado -->
  <section class="cameras-main-container">
  <div class="cameras-layout" id="contenedor-camaras">
    <div class="camera-card">
      <div class="camera-header">
        <span>Cámara 1</span>
        <span class="camera-status online">En línea</span>
      </div>
      <div class="camera-feed hover" onclick="mostrarCamara(1)">
        <img id="cam1-img" data-src="/mjpeg1/" src="/mjpeg1/" class="video-feed" />
      </div>
    </div>

    <div class="camera-card">
      <div class="camera-header">
        <span>Cámara 2</span>
        <span class="camera-status online">En línea</span>
      </div>
      <div class="camera-feed hover" onclick="mostrarCamara(2)">
        <img id="cam2-img" data-src="/mjpeg2/" src="/mjpeg2/" class="video-feed" />
      </div>
    </div>

    <div class="camera-card">
      <div class="camera-header">
        <span>Cámara 3</span>
        <span class="camera-status online">En línea</span>
      </div>
      <div class="camera-feed hover" onclick="mostrarCamara(3)">
        <img id="cam3-img" data-src="/mjpeg3/" src="/mjpeg3/" class="video-feed" />
      </div>
    </div>
  </div>
</section>
</main>

<!-- Modal para vista individual de cámara -->
<div class="modal fade" id="cameraModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content tactical-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCameraTitle">Vista de Cámara</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img id="modal-camera-img" src="" class="img-fluid" style="max-height: 70vh;">
      </div>
    </div>
  </div>
</div>

<script>
  const listaGrabacionesURL = "{% url 'lista_grabaciones' %}";
  const csrfToken = '{{ csrf_token }}';
  const empezarGrabacionURL = "{% url 'comenzar_grabacion_todas' %}";
  const detenerGrabacionURL = "{% url 'detener_grabacion_todas' %}";
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/grabacion.js' %}" defer></script>
<script src="{% static 'js/camara_individual.js' %}" defer></script>
<script src="{% static 'js/status.js' %}" defer></script>
</body>
</html>
